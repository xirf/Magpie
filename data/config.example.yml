client:
  type: qbittorrent
  host: http://localhost:8080/
  user: admin
  password: adminadmin

telegram:
  enabled: false
  bot_token: PUT_YOUR_TELEGRAM_BOT_TOKEN_HERE
  proxy: null # Optional SOCKS or HTTP proxy connection string settings

discord:
  enabled: false
  token: PUT_YOUR_DISCORD_BOT_TOKEN_HERE

redis:
  url: null # Optional Redis connection URL (e.g. redis://localhost:6379/0). Defaults to in-memory emulator.

s3:
  enabled: false
  endpoint: null # Optional endpoint URL (e.g. for MinIO, Cloudflare R2, Backblaze B2)
  access_key: null
  secret_key: null
  bucket: null
  region: null
  link_expiry: 3600 # Link expiration time in seconds (default: 1 hour)
  mode: mount # 'mount' (files are already in S3) or 'upload' (upload completed files via S3 API)

# Seeding policy after download completes.
# Options:
#   - always: Keep seeding the torrent (default)
#   - never: Automatically pause the torrent to stop seeding
#   - admin_only: Pause the torrent unless the user receiving the notification is an administrator
seed_after_download: always

users:
  # - user_id: 123456789             # Telegram user ID (optional)
  #   discord_id: 123456789          # Discord User Snowflake ID (optional)
  #   role: administrator            # Role: administrator, manager, reader
  #   notify: true                   # Receive DM notification when torrent finishes downloading
  #   locale: en                     # User language: en, es, it, pt, ru, uk
  #   notification_filter: []        # Limit notifications to specific qBittorrent categories
